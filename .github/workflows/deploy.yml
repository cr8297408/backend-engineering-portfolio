name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-publish without pushing a commit.
  workflow_dispatch:

# Read the repo, write the Pages deployment, and mint the OIDC token
# actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let it win.
# `cancel-in-progress: false` so a half-finished deploy is not left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repo is locked with package-lock.json, so npm ci is the
      # reproducible install here (the README's pnpm instructions are stale).
      - name: Install dependencies
        run: npm ci

      # `base` defaults to /backend-engineering-portfolio in astro.config.mjs.
      # Override BASE_PATH=/ and SITE_URL if this ever moves to a custom domain.
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
